# Builds and pushes ghcr.io/woodarddigital/gpu-diag whenever the wrapper or
# the script changes on main. The image only needs rebuilding for wrapper
# changes; script changes are picked up at run time from the repo, but the
# fallback copy inside the image is refreshed here too.
name: gpu-diag image

on:
  push:
    branches: [main]
    paths:
      - gpu-diag/gpu-diag.sh
      - gpu-diag/k8s/Dockerfile
      - gpu-diag/k8s/entrypoint.sh
      - .github/workflows/gpu-diag-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/woodarddigital/gpu-diag
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: gpu-diag
          file: gpu-diag/k8s/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.sha }}
